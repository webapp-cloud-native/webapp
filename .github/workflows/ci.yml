name: webapp-ci

on:
    pull_request:
        branches: [main]

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        timeout-minutes: 10

        services:
            postgres:
                image: postgres:14
                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: webapp_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done
                  echo "PostgreSQL is ready!"

            - name: Run tests
              run: npm test
              env:
                  NODE_ENV: test
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_NAME: webapp_test
                  DB_USER: test_user
                  DB_PASSWORD: test_password
