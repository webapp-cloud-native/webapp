      - name: Install dependencies
        run: npm ci
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Run User Management Tests
        run: npm test tests/integration/user.test.js
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: webapp_test
          DB_USER: test_user
          DB_PASSWORD: test_password

  # Job 4: User Authentication Integration Tests  
