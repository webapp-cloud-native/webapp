name: Packer Build AMI

on:
  push:
    branches:
      - main

jobs:
  build-ami:
    name: Build and Share AMI
    runs-on: ubuntu-latest
    if: github.repository == 'webapp-cloud-native/webapp'
    env:
      AWS_REGION: us-east-1
      PRODUCT_VERSION: latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Create .env file for build
      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=8080
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      # Step 5: Setup PostgreSQL for tests
      - name: Setup PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRES_DB }};"
          sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRES_USER }} WITH PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';"
          sudo -u postgres psql -c "ALTER USER ${{ secrets.POSTGRES_USER }} WITH SUPERUSER;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRES_DB }} TO ${{ secrets.POSTGRES_USER }};"

      # Step 6: Run Integration Tests
      - name: Run Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Step 7: Build application artifact
      - name: Create application artifact
        run: |
          zip -r webapp.zip . \
            -x "*.git*" \
            -x "*tests*" \
            -x "*.github*" \
            -x "*packer*" \
            -x "*.DS_Store" \
            -x "*coverage*" \
            -x "*.vscode*" \

          ls -lh webapp.zip

      # Step 8: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 9: Setup Packer
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      # Step 10: Initialize Packer
      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      # Step 11: Build AMI
      - name: Build AMI with Packer
        run: |
          cd packer
          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "dev_account_id=${{ secrets.DEV_ACCOUNT_ID }}" \
            aws-ubuntu.pkr.hcl

      # Step 12: Save AMI ID
      - name: Get AMI ID from manifest
        id: ami
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d ":" -f2)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"

      # Step 13: Output AMI information
      - name: Print AMI Details
        run: |
          echo "AMI ID: ${{ steps.ami.outputs.AMI_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Shared with DEMO account: ${{ secrets.DEMO_ACCOUNT_ID }}"
