name: Packer Build AMI

on:
  push:
    branches:
      - main

jobs:
  build-ami:
    name: Build and Deploy AMI
    runs-on: ubuntu-latest
    if: github.repository == 'webapp-cloud-native/webapp'
    env:
      AWS_REGION: us-east-1
      PRODUCT_VERSION: latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Create .env file for build
      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=8080
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      # Step 5: Setup PostgreSQL for tests
      - name: Setup PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRES_DB }};"
          sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRES_USER }} WITH PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';"
          sudo -u postgres psql -c "ALTER USER ${{ secrets.POSTGRES_USER }} WITH SUPERUSER;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRES_DB }} TO ${{ secrets.POSTGRES_USER }};"

      # Step 6: Run Integration Tests
      - name: Run Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Step 7: Build application artifact
      - name: Create application artifact
        run: |
          zip -r webapp.zip . \
            -x "*.git*" \
            -x "*tests*" \
            -x "*.github*" \
            -x "*packer*" \
            -x "*.DS_Store" \
            -x "*coverage*" \
            -x "*.vscode*"

          ls -lh webapp.zip

          echo "Verifying node_modules is included:"
          unzip -l webapp.zip | grep "node_modules/" | head -5
          test $(unzip -l webapp.zip | grep -c "node_modules/") -gt 0 || exit 1

      # Step 8: Configure AWS credentials for DEV (where AMI is built)
      - name: Configure AWS Credentials for DEV
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 9: Setup Packer
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      # Step 10: Initialize Packer
      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      # Step 11: Build AMI
      - name: Build AMI with Packer
        run: |
          cd packer
          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "dev_account_id=${{ secrets.DEV_ACCOUNT_ID }}" \
            aws-ubuntu.pkr.hcl

      # Step 12: Save AMI ID
      - name: Get AMI ID from manifest
        id: ami
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d ":" -f2)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT
          echo "✅ Built AMI: $AMI_ID"

      # Step 13: Output AMI information
      - name: Print AMI Details
        run: |
          echo "================================"
          echo "     AMI BUILD COMPLETE"
          echo "================================"
          echo "AMI ID: ${{ steps.ami.outputs.AMI_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Shared with DEMO: ${{ secrets.DEMO_ACCOUNT_ID }}"
          echo "================================"

      # Step 14: Configure AWS credentials for DEMO account
      - name: Configure AWS Credentials for DEMO
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 15: Create new Launch Template version with new AMI
      - name: Create Launch Template Version
        id: lt_version
        run: |
          # Find launch template by name prefix (without wildcards in filter value)
          LAUNCH_TEMPLATE_ID=$(aws ec2 describe-launch-templates \
            --region us-east-1 \
            --query 'LaunchTemplates[?contains(LaunchTemplateName, `demo-vpc-lt`)].LaunchTemplateId' \
            --output text | head -1)

          echo "Launch Template ID: $LAUNCH_TEMPLATE_ID"

          # Verify we got a valid ID
          if [ -z "$LAUNCH_TEMPLATE_ID" ] || [ "$LAUNCH_TEMPLATE_ID" == "None" ]; then
            echo "❌ Error: Could not find launch template"
            echo "Listing all launch templates:"
            aws ec2 describe-launch-templates \
              --query 'LaunchTemplates[*].[LaunchTemplateId,LaunchTemplateName]' \
              --output table
            exit 1
          fi

          # Create new version with the new AMI
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id $LAUNCH_TEMPLATE_ID \
            --source-version '$Latest' \
            --launch-template-data "ImageId=${{ steps.ami.outputs.AMI_ID }}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "✅ Created Launch Template Version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Set new version as default
          aws ec2 modify-launch-template \
            --launch-template-id $LAUNCH_TEMPLATE_ID \
            --default-version $NEW_VERSION

          echo "✅ Set version $NEW_VERSION as default"

      # Step 16: Trigger Instance Refresh
      - name: Start Instance Refresh
        id: refresh
        run: |
          ASG_NAME="aniruddha-demo-vpc-asg"

          echo "🔄 Starting instance refresh for ASG: $ASG_NAME"

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 300,
              "CheckpointPercentages": [50, 100],
              "CheckpointDelay": 60
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "✅ Instance Refresh ID: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      # Step 17: Wait for Instance Refresh to Complete
      - name: Wait for Instance Refresh Completion
        run: |
          ASG_NAME="aniruddha-demo-vpc-asg"
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          echo "⏳ Waiting for instance refresh to complete..."
          echo "This may take 5-15 minutes depending on ASG size and health checks."

          MAX_WAIT=900  # 15 minutes
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name $ASG_NAME \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name $ASG_NAME \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text)
            
            echo "Status: $STATUS | Progress: ${PERCENTAGE}%"
            
            case $STATUS in
              "Successful")
                echo "✅ Instance refresh completed successfully!"
                exit 0
                ;;
              "Failed"|"Cancelled")
                echo "❌ Instance refresh failed or was cancelled"
                REASON=$(aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name $ASG_NAME \
                  --instance-refresh-ids $REFRESH_ID \
                  --query 'InstanceRefreshes[0].StatusReason' \
                  --output text)
                echo "Reason: $REASON"
                exit 1
                ;;
              "Pending"|"InProgress")
                echo "⏳ Still in progress... checking again in 30 seconds"
                sleep 30
                ELAPSED=$((ELAPSED + 30))
                ;;
              *)
                echo "⚠️ Unknown status: $STATUS"
                sleep 30
                ELAPSED=$((ELAPSED + 30))
                ;;
            esac
          done

          echo "❌ Timeout waiting for instance refresh (15 minutes)"
          exit 1

      # Step 18: Deployment Summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "======================================="
          echo "       DEPLOYMENT SUMMARY"
          echo "======================================="
          echo "✅ AMI ID: ${{ steps.ami.outputs.AMI_ID }}"
          echo "✅ Launch Template Version: ${{ steps.lt_version.outputs.version }}"
          echo "✅ Instance Refresh: ${{ steps.refresh.outputs.refresh_id }}"
          echo "✅ Auto Scaling Group: aniruddha-demo-vpc-asg"
          echo "======================================="
          echo "🎉 New instances running with latest code!"
          echo "🌐 Application URL: https://demo.aniruddha-webapp.me"
          echo "======================================="
